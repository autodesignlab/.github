name: SonarQube Integration Analysis
on:
  push:
permissions:
  contents: read
jobs:
  sonarqube:
    if: github.ref_name == 'dev' || github.ref_name == github.event.repository.default_branch
    uses: autodesignlab/org-workflows/.github/workflows/code-quality.yml@main
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
