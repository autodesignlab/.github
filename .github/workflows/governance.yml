name: Governance

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  governance:
    uses: autodesignlab/org-workflows/.github/workflows/governance-check.yml@main
    with:
      mode: observe
    secrets:
      GOVERNANCE_APP_CLIENT_ID: ${{ secrets.GOVERNANCE_APP_CLIENT_ID }}
      GOVERNANCE_APP_PRIVATE_KEY: ${{ secrets.GOVERNANCE_APP_PRIVATE_KEY }}
      GOVERNANCE_READ_TOKEN: ${{ secrets.GOVERNANCE_READ_TOKEN }}
